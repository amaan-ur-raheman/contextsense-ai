# Server configuration.
#
# fileWatcherType = "none" disables Streamlit's local source watcher. At
# startup the watcher walks sys.modules probing each entry with hasattr(m,
# "__path__"). transformers/__init__.py implements a lazy __getattr__ that
# imports a module on attribute access, so those harmless probes import every
# vision model in transformers -- each of which does `from torchvision...`,
# and torchvision is not a dependency here. The resulting ModuleNotFoundError
# tracebacks are noise: the app runs, and only text encoders are used.
#
# Disabling the watcher removes the module walk, so the probes never happen.
# The cost is no hot-reload: editing app.py requires restarting the app.

[server]
fileWatcherType = "none"

# ---------------------------------------------------------------------------
# Design tokens
# ---------------------------------------------------------------------------
# The palette lives here rather than in app.py CSS so Streamlit itself owns
# both themes. These values reach every widget -- buttons, tabs, metrics,
# dataframes, the theme switcher -- with no selector hacking, so they survive a
# Streamlit upgrade instead of silently decaying into broken overrides.
#
# Colours were chosen in OKLCH for perceptual evenness (equal steps look equal)
# and converted to hex. Every foreground/background pair below was checked with
# the WCAG formula; the worst case is 5.01:1 against a 4.5:1 floor for body text.
#
# Strategy is restrained: tinted neutrals carrying one accent used only for
# primary actions and the current selection. Streamlit's own semantic colours
# (green/amber/red for alerts) are left alone so status still reads as status.
# ---------------------------------------------------------------------------

[theme]
base = "light"
primaryColor = "#00768f"
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#eef2f5"
textColor = "#1b2026"
borderColor = "#dadfe2"
baseRadius = "small"
font = "Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
# Fixed rem scale at a 1.125 ratio. Product UI is viewed at a consistent DPI,
# so fluid clamp() headings only add jitter; the tighter ratio keeps the many
# type elements in a dense tool from competing with each other.
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.05rem", "1rem", "0.95rem"]
baseFontSize = 15

[theme.light]
primaryColor = "#00768f"
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#eef2f5"
textColor = "#1b2026"
borderColor = "#dadfe2"

[theme.dark]
primaryColor = "#36b8c5"
backgroundColor = "#0d1116"
secondaryBackgroundColor = "#171c22"
textColor = "#e8ecef"
borderColor = "#2e333a"

# The sidebar is a second surface layer, slightly cooler than the content area,
# so the eye separates navigation from the working surface without a border.
[theme.light.sidebar]
backgroundColor = "#eef2f5"
secondaryBackgroundColor = "#e4e9ee"
borderColor = "#dadfe2"
primaryColor = "#00768f"
textColor = "#1b2026"

[theme.dark.sidebar]
backgroundColor = "#171c22"
secondaryBackgroundColor = "#1f252c"
borderColor = "#2e333a"
primaryColor = "#36b8c5"
textColor = "#e8ecef"