[project]
name = "contextsense-ai"
package-root = "src"
version = "0.1.0"
description = "Context-aware Word Sense Disambiguation using WordNet and word embeddings"
readme = "README.md"
authors = [
    { name = "Amaan Ur Raheman Shaikh", email = "amaanurrahemanshaikh@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "nltk>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "streamlit>=1.35",
    "plotly>=5.22",
    "gensim>=4.3",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[project.scripts]
download-resources = "contextsense_ai.scripts.download_resources:main"
run-evaluation = "contextsense_ai.scripts.run_evaluation:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# These libraries ship no type information; silence the per-import noise so real
# type errors in our own code stay visible.
[[tool.mypy.overrides]]
module = ["nltk.*", "sklearn.*", "pandas.*", "gensim.*"]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
